<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Prompt Hub</title>
    
    <!-- Favicon & SEO Meta Tags -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <meta name="description" content="Admin Dashboard to manage AI Prompt Hub prompts and tools.">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col">

    <!-- Navbar -->
    <nav class="w-full glass shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 text-white hover:text-indigo-400 transition-colors">
                <i class="fa-solid fa-arrow-left"></i>
                <span class="font-bold">Back to Hub</span>
            </a>
            <div id="adminControls" class="hidden">
                <button id="logoutBtn" class="text-sm bg-red-500/20 text-red-400 px-4 py-2 rounded-lg hover:bg-red-500/30 transition-colors">
                    <i class="fa-solid fa-right-from-bracket mr-2"></i>Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center p-4">
        
        <!-- Login Section -->
        <div id="loginSection" class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl my-auto">
            <div class="text-center mb-8">
                <i class="fa-solid fa-shield-halved text-4xl text-indigo-400 mb-4"></i>
                <h2 class="text-2xl font-bold text-white">Admin Login</h2>
                <p class="text-gray-400 text-sm mt-2">Secure access required to manage prompts.</p>
            </div>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                </div>
                <div id="loginError" class="text-red-400 text-sm hidden"></div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                    Sign In
                </button>
            </form>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboardSection" class="hidden w-full max-w-5xl space-y-8 my-8">
            
            <!-- Upload Form -->
            <div class="glass p-8 rounded-2xl shadow-2xl">
                <div class="border-b border-gray-700 pb-4 mb-6">
                    <h2 class="text-2xl font-bold text-white" id="formTitle">Upload New Prompt</h2>
                    <p class="text-gray-400 text-sm">Add or edit generated assets in the public feed.</p>
                </div>
                
                <form id="uploadForm" class="space-y-6">
                    <input type="hidden" id="editPostId" value="">
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Title</label>
                            <input type="text" id="promptTitle" required placeholder="e.g. Cyberpunk Cityscape" class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Category</label>
                            <select id="promptCategory" required class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                                <option value="" disabled selected>Select Category</option>
                                <option value="Gaming">Gaming</option>
                                <option value="Love & Romance">Love & Romance</option>
                                <option value="Sci-Fi & Cyberpunk">Sci-Fi & Cyberpunk</option>
                                <option value="Anime & Fantasy">Anime & Fantasy</option>
                                <option value="Photorealistic">Photorealistic</option>
                                <option value="Nature & Landscapes">Nature & Landscapes</option>
                                <option value="3D & Concept Art">3D & Concept Art</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-400 mb-1">Recommended AI Tool</label>
                            <select id="aiTool" required class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                                <option value="ChatGPT">ChatGPT (DALL·E)</option>
                                <option value="Gemini">Google Gemini</option>
                                <option value="Midjourney">Midjourney</option>
                                <option value="DALL·E 3">DALL·E 3</option>
                                <option value="Leonardo AI">Leonardo AI</option>
                                <option value="Stable Diffusion">Stable Diffusion</option>
                                <option value="Claude">Claude AI</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">AI Prompt Text</label>
                        <textarea id="promptText" required rows="4" placeholder="Enter the exact prompt used..." class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white font-mono text-sm"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1">Initial Likes Count</label>
                        <input type="number" id="initialLikes" value="0" min="0" class="w-full px-4 py-2 bg-gray-800 border border-gray-600 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-1" id="imageLabel">AI Image</label>
                        <input type="file" id="promptImage" accept="image/*" class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 transition-colors">
                        <p id="imageHelp" class="text-xs text-gray-500 mt-1 hidden">Leave empty if you don't want to change the existing image while editing.</p>
                    </div>

                    <div id="uploadStatus" class="hidden text-sm p-3 rounded-lg bg-gray-800"></div>

                    <div class="flex gap-4">
                        <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cloud-arrow-up"></i> <span id="submitBtnText">Upload to Hub</span>
                        </button>
                        <button type="button" id="cancelEditBtn" class="hidden bg-gray-700 hover:bg-gray-600 text-white font-bold py-3 px-6 rounded-lg transition-colors">
                            Cancel Edit
                        </button>
                    </div>
                </form>
            </div>

            <!-- Manage Existing Posts Section -->
            <div class="glass p-8 rounded-2xl shadow-2xl">
                <h3 class="text-xl font-bold text-white mb-6">Manage Uploaded Prompts</h3>
                <div id="adminPostsList" class="space-y-4">
                    <p class="text-gray-400 text-center py-4">Loading posts...</p>
                </div>
            </div>

        </div>
    </main>

<script type="module" src="js/admin12qw.js"></script>
</body>
</html>
